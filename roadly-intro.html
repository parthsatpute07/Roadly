<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Roadly</title>

    <!-- ONLY intro-page CSS -->
    <link rel="stylesheet" href="roadly-intro.css">
</head>

<body>

    <div class="intro-screen">

        <!-- Background glow -->
        <div class="glow glow-one"></div>
        <div class="glow glow-two"></div>

        <!-- Main Roadly Logo -->
        <div class="roadly-container">

            <!-- Car orbit -->
            <div class="orbit">

                <div class="car">
                    🚗
                </div>

            </div>

            <!-- Text -->
            <div class="brand">

                <p class="tagline">
                    YOUR JOURNEY. YOUR ADVENTURE.
                </p>

                <h1>
                    ROADLY
                </h1>

                <p class="subtitle">
                    Travel smarter. Explore farther.
                </p>

            </div>

        </div>

        <!-- Loading line -->
        <div class="loading-container">

            <div class="loading-bar">
                <div class="loading-progress"></div>
            </div>

            <p>
                Preparing your journey...
            </p>

        </div>

    </div>

    <script src="roadly-intro.js"></script>

</body>

</html>
