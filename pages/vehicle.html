<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Roadly • Vehicle</title>

<link rel="stylesheet" href="../css/global.css">
<link rel="stylesheet" href="../css/sections.css">

</head>

<body>

<section class="trip-page">

<div class="container">

<h1>Choose Your Vehicle</h1>

<p>Select your primary mode of travel.</p>

<div class="vehicle-grid">

<label class="vehicle-card">

<input type="radio" name="vehicle" value="Car">

<div class="vehicle-icon">🚗</div>

<h3>Car</h3>

<p>Best for family road trips.</p>

</label>

<label class="vehicle-card">

<input type="radio" name="vehicle" value="Bike">

<div class="vehicle-icon">🏍️</div>

<h3>Bike</h3>

<p>Adventure and scenic rides.</p>

</label>

<label class="vehicle-card">

<input type="radio" name="vehicle" value="Bus">

<div class="vehicle-icon">🚌</div>

<h3>Bus</h3>

<p>Affordable public transport.</p>

</label>

<label class="vehicle-card">

<input type="radio" name="vehicle" value="Train">

<div class="vehicle-icon">🚆</div>

<h3>Train</h3>

<p>Comfortable long-distance travel.</p>

</label>

<label class="vehicle-card">

<input type="radio" name="vehicle" value="Flight">

<div class="vehicle-icon">✈️</div>

<h3>Flight</h3>

<p>Fastest option for long journeys.</p>

</label>

</div>

<button id="saveVehicle" class="primary-btn">

Continue →

</button>

</div>

</section>

<script src="../js/vehicle.js"></script>

</body>

</html>
