<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>

Roadly • Trip Details

</title>


<link rel="stylesheet"
href="../css/global.css">

<link rel="stylesheet"
href="../css/sections.css">

</head>

<body>

<section class="trip-page">

<div class="container">

<h1>

Let's Plan Your Journey

</h1>

<p>

Tell us where you're travelling.

</p>

<div class="trip-form">

<div class="input-group">

    <input
        id="start"
        type="text"
        placeholder="Starting Location"
        autocomplete="off">

    <div id="startResults" class="search-results"></div>

</div>

<div class="input-group">

    <input
        id="destination"
        type="text"
        placeholder="Destination"
        autocomplete="off">

    <div id="destinationResults" class="search-results"></div>

</div>

<input
id="days"
type="number"
placeholder="Number of Days">

<button
id="continueTrip"
class="primary-btn">

Continue →

</button>

</div>

</div>

</section>


<script src="../js/config.js"></script>

<script src="../js/trip.js"></script>

</body>

</html>
