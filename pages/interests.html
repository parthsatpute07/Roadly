<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Roadly • Travel Interests</title>

<link rel="stylesheet" href="../css/global.css">
<link rel="stylesheet" href="../css/sections.css">

</head>

<body>

<section class="trip-page">

<div class="container">

<h1>What interests you?</h1>

<p>Select one or more interests to personalise your trip.</p>

<div class="interest-grid">

<label class="interest-card">
<input type="checkbox" value="Adventure">
<div>🏔️</div>
<h3>Adventure</h3>
</label>

<label class="interest-card">
<input type="checkbox" value="Nature">
<div>🌿</div>
<h3>Nature</h3>
</label>

<label class="interest-card">
<input type="checkbox" value="Food">
<div>🍜</div>
<h3>Food</h3>
</label>

<label class="interest-card">
<input type="checkbox" value="Beaches">
<div>🏖️</div>
<h3>Beaches</h3>
</label>

<label class="interest-card">
<input type="checkbox" value="Photography">
<div>📸</div>
<h3>Photography</h3>
</label>

<label class="interest-card">
<input type="checkbox" value="History">
<div>🏛️</div>
<h3>History</h3>
</label>

<label class="interest-card">
<input type="checkbox" value="Nightlife">
<div>🌃</div>
<h3>Nightlife</h3>
</label>

<label class="interest-card">
<input type="checkbox" value="Shopping">
<div>🛍️</div>
<h3>Shopping</h3>
</label>

</div>

<button id="saveInterests" class="primary-btn">

Continue →

</button>

</div>

</section>

<script src="../js/interests.js"></script>

</body>

</html>
