<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Roadly • Budget</title>

<link rel="stylesheet" href="../css/global.css">
<link rel="stylesheet" href="../css/sections.css">

</head>

<body>

<section class="trip-page">

<div class="container">

<h1>Select Your Budget</h1>

<p>Choose the travel style that best matches your budget.</p>

<div class="budget-grid">

<label class="budget-card">

<input type="radio" name="budget" value="Budget">

<h2>💵</h2>

<h3>Budget</h3>

<p>Perfect for affordable trips.</p>

<span>Up to ₹10,000</span>

</label>

<label class="budget-card">

<input type="radio" name="budget" value="Standard">

<h2>💳</h2>

<h3>Standard</h3>

<p>Comfortable hotels & restaurants.</p>

<span>₹10k – ₹30k</span>

</label>

<label class="budget-card">

<input type="radio" name="budget" value="Premium">

<h2>💎</h2>

<h3>Premium</h3>

<p>Luxury stays and experiences.</p>

<span>₹30k – ₹60k</span>

</label>

<label class="budget-card">

<input type="radio" name="budget" value="Luxury">

<h2>👑</h2>

<h3>Luxury</h3>

<p>Five-star travel experience.</p>

<span>₹60,000+</span>

</label>

</div>

<button id="saveBudget" class="primary-btn">

Continue →

</button>

</div>

</section>

<script src="../js/budget.js"></script>

</body>

</html>
